<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远程交互 - 验证处理</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f5; }
.header { background:#fff; border-bottom:1px solid #e0e0e0; padding:16px 24px; display:flex; align-items:center; gap:12px; }
.header a { color:#e65100; text-decoration:none; font-size:14px; }
.header a:hover { text-decoration:underline; }
.header h1 { font-size:18px; color:#1a1a1a; flex:1; }
.container { max-width:800px; margin:24px auto; padding:0 16px; }
.card { background:#fff; border-radius:8px; padding:24px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.card h2 { font-size:16px; color:#1a1a1a; margin-bottom:12px; }
.info-grid { display:grid; grid-template-columns: auto 1fr; gap:8px 16px; font-size:14px; }
.info-grid .label { color:#888; }
.info-grid .value { color:#333; }
.screenshot-container { width:100%; max-height:500px; overflow:auto; border:1px solid #e0e0e0; border-radius:6px; background:#fafafa; }
.screenshot-container img { width:100%; display:block; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:14px; font-weight:500; color:#333; margin-bottom:6px; }
.form-group textarea, .form-group input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none; transition:border-color .2s; font-family:inherit; }
.form-group textarea:focus, .form-group input:focus { border-color:#e65100; }
.form-group textarea { min-height:60px; resize:vertical; }
.hint-text { font-size:12px; color:#999; margin-top:4px; }
.actions { display:flex; gap:12px; margin-top:20px; }
.btn { padding:10px 24px; border:none; border-radius:6px; font-size:14px; cursor:pointer; transition:background .2s; }
.btn-primary { background:#e65100; color:#fff; }
.btn-primary:hover { background:#d44a00; }
.btn-secondary { background:#f5f5f5; color:#333; }
.btn-secondary:hover { background:#e0e0e0; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.status-badge { display:inline-block; padding:4px 12px; border-radius:12px; font-size:13px; font-weight:500; }
.status-pending { background:#fff3e0; color:#e65100; }
.status-resolved { background:#e8f5e9; color:#2e7d32; }
.status-timeout { background:#fce4ec; color:#c62828; }
.status-cancelled { background:#f3f3f3; color:#757575; }
.countdown { font-size:13px; color:#e65100; margin-top:8px; }
.countdown.expired { color:#c62828; }
.error-msg { color:#d32f2f; font-size:14px; padding:20px; text-align:center; }
.loading { text-align:center; padding:60px; color:#999; }
.loading .spinner { display:inline-block; width:32px; height:32px; border:3px solid #e0e0e0; border-top-color:#e65100; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <a href="/dashboard.html?token=" id="backLink">← 返回控制台</a>
  <h1 id="pageTitle">验证处理</h1>
  <span class="status-badge" id="statusBadge">加载中</span>
</div>
<div class="container" id="mainContainer">
  <div class="loading" id="loadingEl"><div class="spinner"></div><p>加载验证请求...</p></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const requestId = params.get('id');
const token = params.get('token');
if (!token) { window.location.href = '/'; }
document.getElementById('backLink').href = '/dashboard.html?token=' + encodeURIComponent(token);

let requestData = null;
let countdownTimer = null;

async function loadRequest() {
  if (!requestId) {
    document.getElementById('mainContainer').innerHTML = '<div class="error-msg">缺少请求 ID</div>';
    return;
  }
  try {
    const r = await fetch('/api/requests/' + encodeURIComponent(requestId) + '?token=' + encodeURIComponent(token));
    if (r.status === 404) {
      document.getElementById('mainContainer').innerHTML = '<div class="error-msg">请求不存在或已过期</div>';
      return;
    }
    requestData = await r.json();
    render();
  } catch(e) {
    document.getElementById('mainContainer').innerHTML = '<div class="error-msg">加载失败: ' + e.message + '</div>';
  }
}

function render() {
  document.getElementById('loadingEl').style.display = 'none';
  const d = requestData;
  document.getElementById('pageTitle').textContent = d.title || '验证处理';
  const statusMap = { pending: '待处理', resolved: '已处理', timeout: '已超时', cancelled: '已取消' };
  const badge = document.getElementById('statusBadge');
  badge.textContent = statusMap[d.status] || d.status;
  badge.className = 'status-badge status-' + d.status;

  if (d.status !== 'pending') {
  }

  let html = '<div class="card"><h2>请求信息</h2><div class="info-grid">';
  html += '<span class="label">类型</span><span class="value">' + d.typeLabel + '</span>';
  html += '<span class="label">来源</span><span class="value">' + d.crawler + '</span>';
  html += '<span class="label">时间</span><span class="value">' + new Date(d.timestamp).toLocaleString('zh-CN') + '</span>';
  html += '<span class="label">描述</span><span class="value">' + (d.description || '无') + '</span>';
  html += '<span class="label">超时</span><span class="value" id="timeoutDisplay">' + Math.round(d.timeout / 60000) + ' 分钟</span>';
  html += '</div></div>';

  if (d.screenshot) {
    html += '<div class="card"><h2>页面截图</h2><div class="screenshot-container"><img src="' + d.screenshot + '" alt="页面截图"></div></div>';
  }

  if (d.status === 'pending') {
    html += '<div class="card"><h2>操作</h2>';
    html += '<div class="form-group"><label for="response">请输入验证信息</label>';
    html += '<input type="text" id="response" placeholder="输入验证码、登录凭证等" autofocus>';
    html += '<div class="hint-text">根据截图内容输入相应的验证信息</div></div>';
    html += '<div class="countdown" id="countdownEl">剩余时间：计算中...</div>';
    html += '<div class="actions">';
    html += '<button class="btn btn-primary" id="submitBtn" onclick="submitResponse()">提交</button>';
    html += '<button class="btn btn-secondary" onclick="cancelReq()">取消请求</button>';
    html += '</div></div>';
  } else if (d.status === 'resolved') {
    html += '<div class="card"><h2>处理结果</h2><p>已验证响应: ' + (d.response || '已处理') + '</p></div>';
  } else {
    html += '<div class="card"><h2>处理结果</h2><p>请求状态: ' + statusMap[d.status] + '</p></div>';
  }

  document.getElementById('mainContainer').innerHTML = html;

  if (d.status === 'pending') {
    startCountdown(d.timeout);
    document.getElementById('response').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitResponse();
    });
  }
}

function startCountdown(timeoutMs) {
  const endTime = requestData.timestamp + timeoutMs;
  updateCountdown(endTime);
  countdownTimer = setInterval(() => updateCountdown(endTime), 1000);
}
function updateCountdown(endTime) {
  const el = document.getElementById('countdownEl');
  if (!el) return;
  const remaining = Math.max(0, endTime - Date.now());
  if (remaining <= 0) {
    el.textContent = '已超时';
    el.className = 'countdown expired';
    document.getElementById('submitBtn').disabled = true;
    clearInterval(countdownTimer);
    return;
  }
  const min = Math.floor(remaining / 60000);
  const sec = Math.floor((remaining % 60000) / 1000);
  el.textContent = `剩余时间：${min}分${sec}秒`;
  el.className = 'countdown';
}

async function submitResponse() {
  const response = document.getElementById('response').value.trim();
  if (!response) { alert('请输入验证信息'); return; }
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = '提交中...';
  try {
    const r = await fetch('/api/requests/' + encodeURIComponent(requestId) + '/respond?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ response }),
    });
    if (r.ok) {
      document.getElementById('submitBtn').textContent = '已提交 ✓';
      document.getElementById('submitBtn').style.background = '#2e7d32';
      if (countdownTimer) clearInterval(countdownTimer);
      showToast('验证信息已提交');
      setTimeout(() => window.location.href = '/dashboard.html?token=' + encodeURIComponent(token), 1500);
    } else {
      const data = await r.json();
      alert(data.error || '提交失败');
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = '提交';
    }
  } catch(e) {
    alert('提交失败: ' + e.message);
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '提交';
  }
}

async function cancelReq() {
  try {
    await fetch('/api/requests/' + encodeURIComponent(requestId) + '/cancel?token=' + encodeURIComponent(token), { method:'POST' });
    window.location.href = '/dashboard.html?token=' + encodeURIComponent(token);
  } catch(e) { alert('操作失败'); }
}

function showToast(text) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#323232;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

loadRequest();
</script>
</body>
</html>
