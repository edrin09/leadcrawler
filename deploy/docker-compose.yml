version: '3.8'

x-common-env: &common-env
  TZ: Asia/Shanghai
  NODE_ENV: production
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  crawler:
    build:
      context: ..
      dockerfile: deploy/docker/crawler/Dockerfile
    container_name: crawler-main
    restart: unless-stopped
    environment:
      <<: *common-env
      CRAWLER_PORT: "${CRAWLER_PORT:-3001}"
      METRICS_PORT: "${METRICS_PORT:-9091}"
      STORAGE_TYPE: "${STORAGE_TYPE:-sqlite}"
      SQLITE_PATH: "${SQLITE_PATH:-/app/crawler/storage/data.db}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_DIR: "${LOG_DIR:-/app/crawler/logs}"
      SCREENSHOT_DIR: "${SCREENSHOT_DIR:-/app/crawler/screenshots}"
      OUTPUT_DIR: "${OUTPUT_DIR:-/app/crawler/output}"
      CAPTCHA_API_KEY: "${CAPTCHA_API_KEY:-}"
      CAPTCHA_API_URL: "${CAPTCHA_API_URL:-}"
      CAPTCHA_MANUAL_DIR: "${CAPTCHA_MANUAL_DIR:-/app/crawler/screenshots/manual}"
      NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL:-}"
      NOTIFY_EMAIL_TO: "${NOTIFY_EMAIL_TO:-}"
      NOTIFY_EMAIL_FROM: "${NOTIFY_EMAIL_FROM:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      CRAWL_58: "${CRAWL_58:-true}"
      CRAWL_ANJUKE: "${CRAWL_ANJUKE:-true}"
      CRAWL_GOOFISH: "${CRAWL_GOOFISH:-false}"
      CRAWL_XIAOHONGSHU: "${CRAWL_XIAOHONGSHU:-false}"
      CRAWL_DOUYIN: "${CRAWL_DOUYIN:-false}"
      WEBMAN_PORT: "${WEBMAN_PORT:-8787}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_HOST: "${DB_HOST:-}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-}"
      DB_USERNAME: "${DB_USERNAME:-}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
    ports:
      - "${CRAWLER_PORT:-3001}:3001"
      - "${METRICS_PORT:-9091}:9091"
      - "${WEBMAN_PORT:-8787}:8787"
    volumes:
      - crawler_data:/app/crawler/storage
      - crawler_logs:/app/crawler/logs
      - crawler_screenshots:/app/crawler/screenshots
      - crawler_output:/app/crawler/output
      - webman_runtime:/app/webman/runtime
    networks:
      - crawler-net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node|php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${CRAWLER_CPU_LIMIT:-2}'
          memory: ${CRAWLER_MEMORY_LIMIT:-2G}
        reservations:
          cpus: '0.5'
          memory: 512M

  scheduler:
    build:
      context: ..
      dockerfile: deploy/docker/scheduler/Dockerfile
    container_name: crawler-scheduler
    restart: unless-stopped
    environment:
      <<: *common-env
      SCHEDULER_PORT: "${SCHEDULER_PORT:-3000}"
      CRAWLER_API_URL: "${CRAWLER_API_URL:-http://crawler:3001}"
      CRAWL_58: "${CRAWL_58:-true}"
      CRAWL_ANJUKE: "${CRAWL_ANJUKE:-true}"
      CRAWL_GOOFISH: "${CRAWL_GOOFISH:-false}"
      CRAWL_XIAOHONGSHU: "${CRAWL_XIAOHONGSHU:-false}"
      CRAWL_DOUYIN: "${CRAWL_DOUYIN:-false}"
      CRAWL_58_CRON: "${CRAWL_58_CRON:-0 */6 * * *}"
      CRAWL_ANJUKE_CRON: "${CRAWL_ANJUKE_CRON:-0 */4 * * *}"
      CRAWL_GOOFISH_CRON: "${CRAWL_GOOFISH_CRON:-0 */8 * * *}"
      CRAWL_XIAOHONGSHU_CRON: "${CRAWL_XIAOHONGSHU_CRON:-0 */12 * * *}"
      CRAWL_DOUYIN_CRON: "${CRAWL_DOUYIN_CRON:-0 */12 * * *}"
    ports:
      - "${SCHEDULER_PORT:-3000}:3000"
    networks:
      - crawler-net
    logging: *default-logging
    depends_on:
      crawler:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  nginx:
    image: nginx:1.25-alpine
    container_name: crawler-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - crawler_screenshots:/usr/share/nginx/html/screenshots:ro
    networks:
      - crawler-net
    logging: *default-logging
    depends_on:
      - crawler
      - scheduler
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: crawler-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - crawler-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: crawler-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin123}"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards/crawler-dashboard.json:/var/lib/grafana/dashboards/crawler-dashboard.json:ro
      - grafana_data:/var/lib/grafana
    networks:
      - crawler-net
    logging: *default-logging
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: crawler-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - crawler-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  crawler_data:
    driver: local
  crawler_logs:
    driver: local
  crawler_screenshots:
    driver: local
  crawler_output:
    driver: local
  webman_runtime:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  crawler-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16