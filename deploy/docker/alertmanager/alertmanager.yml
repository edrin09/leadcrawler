global:
  resolve_timeout: 5m

route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: '${NOTIFY_WEBHOOK_URL}'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: '${NOTIFY_WEBHOOK_URL}'
        send_resolved: true

  - name: 'warning-receiver'
    webhook_configs:
      - url: '${NOTIFY_WEBHOOK_URL}'
        send_resolved: false