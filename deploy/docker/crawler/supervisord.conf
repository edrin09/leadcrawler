[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:webman]
command=php /app/webman/start/start.php start
directory=/app/webman
autostart=true
autorestart=true
startretries=5
stdout_logfile=/app/webman/runtime/logs/stdout.log
stderr_logfile=/app/webman/runtime/logs/stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
environment=TZ="Asia/Shanghai"
stopwaitsecs=10
stopsignal=TERM

[program:crawler]
command=node /app/crawler/src/scheduler/apiServer.js
directory=/app/crawler
autostart=true
autorestart=true
startretries=5
stdout_logfile=/app/crawler/logs/stdout.log
stderr_logfile=/app/crawler/logs/stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
environment=NODE_ENV="production",TZ="Asia/Shanghai"
stopwaitsecs=10
stopsignal=TERM