upstream crawler_api {
    server crawler:3001;
    keepalive 32;
}

upstream webman_api {
    server crawler:8787;
    keepalive 32;
}

upstream scheduler_api {
    server scheduler:3000;
    keepalive 32;
}

upstream grafana_ui {
    server grafana:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location /api/crawl/ {
        proxy_pass http://crawler_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/scheduler/ {
        rewrite ^/api/scheduler/(.*) /api/$1 break;
        proxy_pass http://scheduler_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://crawler_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://crawler_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /screenshots/ {
        alias /usr/share/nginx/html/screenshots/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /admin/ {
        proxy_pass http://webman_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /grafana/ {
        proxy_pass http://grafana_ui/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 200 '{"service":"crawler-system","version":"2.0.0","endpoints":{"/api/health":"Health check","/api/stats":"Crawler statistics","/api/crawl/{source}":"Trigger crawl","/api/scheduler/tasks":"List scheduled tasks","/admin/":"Webman admin panel","/screenshots/":"Captcha screenshots","/grafana/":"Monitoring dashboard"}}';
        add_header Content-Type application/json;
    }
}