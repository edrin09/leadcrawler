groups:
  - name: crawler_alerts
    interval: 30s
    rules:
      - alert: CrawlerDown
        expr: up{job="crawler"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "采集服务已停止"
          description: "采集服务 crawler 已停止运行超过2分钟"

      - alert: WebmanDown
        expr: up{job="webman-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Webman 服务已停止"
          description: "Webman 管理后台已停止运行超过2分钟"

      - alert: CrawlerHighErrorRate
        expr: rate(crawler_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "采集错误率过高"
          description: "采集错误率超过10%，当前值: {{ $value | humanizePercentage }}"

      - alert: CrawlerLowSuccessRate
        expr: crawler_success_rate < 0.5 and crawler_crawl_total > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "采集成功率过低"
          description: "采集成功率低于50%，当前值: {{ $value | humanizePercentage }}"

      - alert: CaptchaHighDetectionRate
        expr: rate(crawler_captcha_detected_total[30m]) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "验证码检测率过高"
          description: "近30分钟验证码检测率超过30%，可能需要检查目标站点"

      - alert: CaptchaLowSolveRate
        expr: crawler_captcha_solve_rate < 0.3 and crawler_captcha_detected_total > 5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "验证码解决率过低"
          description: "验证码解决率低于30%，需要人工介入或检查验证码服务"

      - alert: CaptchaManualInterventionNeeded
        expr: rate(crawler_captcha_manual_requested_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "需要人工处理验证码"
          description: "近1小时内有验证码需要人工处理，请检查截图目录"

      - alert: BrowserCrashDetected
        expr: rate(crawler_browser_crashes_total[10m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "浏览器进程崩溃"
          description: "检测到浏览器进程崩溃，服务将自动重启"

      - alert: CrawlerNoDataCollected
        expr: crawler_items_collected_total == 0 and crawler_crawl_total > 5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "未采集到数据"
          description: "已执行多次采集但未收集到任何数据，请检查目标站点"

      - alert: SchedulerDown
        expr: up{job="scheduler"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "调度服务已停止"
          description: "调度服务 scheduler 已停止运行超过2分钟"