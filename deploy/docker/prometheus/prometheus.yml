global:
  scrape_interval: 30s
  scrape_timeout: 15s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'crawler'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'crawler:9091'
        labels:
          service: 'crawler'
          env: 'production'

  - job_name: 'crawler-health'
    metrics_path: '/health'
    static_configs:
      - targets:
          - 'crawler:3001'
        labels:
          service: 'crawler-api'

  - job_name: 'webman-health'
    metrics_path: '/health'
    static_configs:
      - targets:
          - 'crawler:8787'
        labels:
          service: 'webman'

  - job_name: 'scheduler'
    metrics_path: '/health'
    static_configs:
      - targets:
          - 'scheduler:3000'
        labels:
          service: 'scheduler'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'