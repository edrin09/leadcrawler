version: '3.8'

services:
  crawler-app:
    build: .
    container_name: crawler-h5-app
    ports:
      - "3000:3000"
    volumes:
      - ./output:/app/output
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/listings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s