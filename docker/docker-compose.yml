services:
  crawler:
    privileged: true
    image: crawler:latest
    container_name: crawler_platform
    ports:
      - "8787:8787"
    volumes:
      - ../webman:/var/www/html
      - ../crawler:/app/crawler
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - my_network

networks:
  my_network:
    external: true
